<!DOCTYPE html>
<html>
<head>
    <title>Debug Parser</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #0B0014; color: #CFA7FF; }
        textarea { width: 100%; height: 60px; margin: 10px 0; padding: 10px; background: #3A0A5C; color: #CFA7FF; border: 2px solid #2A0E44; }
        button { padding: 10px 20px; background: #FF2FA3; color: white; border: none; cursor: pointer; }
        pre { background: #120022; padding: 15px; border: 2px solid #2A0E44; overflow: auto; }
    </style>
</head>
<body>
    <h2>Parser Debug Tool</h2>
    <textarea id="input" placeholder="Enter physics problem">A ball is dropped from 50 m</textarea><br>
    <button onclick="testParse()">Test Parse</button>
    <h3>Result:</h3>
    <pre id="output"></pre>

    <script src="js/parser.js"></script>
    <script>
        function testParse() {
            const text = document.getElementById('input').value;
            console.log('Input:', text);
            
            try {
                const result = parsePhysicsProblem(text);
                console.log('Result:', result);
                document.getElementById('output').textContent = JSON.stringify(result, null, 2);
                
                if (!result.error) {
                    const calculated = calculatePhysics(result);
                    console.log('Calculated:', calculated);
                    document.getElementById('output').textContent += '\n\n=== CALCULATED ===\n' + JSON.stringify(calculated, null, 2);
                }
            } catch(e) {
                console.error('Error:', e);
                document.getElementById('output').textContent = 'ERROR: ' + e.message + '\n\n' + e.stack;
            }
        }
        
        // Auto-test on load
        window.onload = () => testParse();
    </script>
</body>
</html>
